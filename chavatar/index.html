<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="category" content="educational">
    <title>Chess.com Profile Avatar Customizer</title>
    <style>
        :root { --bg: #e7e5e3; --base: #bcbbb7; --shadow: #898785; --highlight: #dad7d5; }
        body { font-family: sans-serif; background: #262522; color: #fff; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .container { max-width: 800px; width: 100%; background: #312e2b; padding: 20px; border-radius: 12px; }
        h1 { text-align: center; border-bottom: 2px solid #3d3a35; padding-bottom: 10px; font-size: 22px; margin-top: 0; }
        .input-group { display: flex; gap: 15px; justify-content: center; align-items: center; background: #21201d; padding: 15px; border-radius: 8px; margin-bottom: 20px; }
        input[type="color"] { border: none; width: 60px; height: 40px; cursor: pointer; background: transparent; }
        .workspace { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        @media (max-width: 600px) { .workspace { grid-template-columns: 1fr; } }
        .preview-pane { display: flex; flex-direction: column; gap: 12px; align-items: center; }
        .preview-box { background: #1a1917; border-radius: 8px; padding: 15px; display: flex; justify-content: center; align-items: center; border: 1px solid #2d2b27; width: 100%; box-sizing: border-box; }
        svg { width: 100%; max-width: 280px; height: auto; border-radius: 4px; }
        
        /* Dropdown Layout & Invisible Bridge Fix */
        .export-wrapper { position: relative; width: 100%; max-width: 280px; }
        .btn-main { width: 100%; background: #769656; color: #fff; border: none; padding: 12px; border-radius: 5px; font-size: 13px; font-weight: bold; text-transform: uppercase; cursor: pointer; }
        .btn-main:hover { background: #95bb72; }
        
        .dropdown-menu { position: absolute; top: calc(100% + 5px); left: 0; width: 100%; background: #21201d; border: 1px solid #4a4640; border-radius: 5px; display: none; flex-direction: column; z-index: 100; box-sizing: border-box; }
        .export-wrapper:hover .dropdown-menu { display: flex; }
        .dropdown-menu::before { content: ''; position: absolute; top: -10px; left: 0; width: 100%; height: 10px; background: transparent; }
        
        .btn-opt { background: transparent; border: none; color: #fff; padding: 12px; font-size: 13px; font-weight: bold; text-align: left; cursor: pointer; }
        .btn-opt:hover { background: #3c3934; color: #95bb72; }
        .btn-opt:first-child { border-bottom: 1px solid #2d2b27; }

        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        th, td { padding: 10px; text-align: left; border-bottom: 1px solid #2d2b27; }
        th { color: #bababa; text-transform: uppercase; }
        .swatch { display: inline-block; width: 16px; height: 16px; border-radius: 4px; vertical-align: middle; margin-right: 8px; }
        .hex-output { color: #95bb72; font-weight: bold; font-family: monospace; }
        .rgb-output { font-family: monospace; color: #bababa; }
    </style>
</head>
<body>

<div class="container">
    <h1>Chess.com Profile Avatar Customizer</h1>
    <div class="input-group">
        <label>CHOOSE AVATAR COLOR THEME:</label>
        <input type="color" id="picker" value="#bcbbb7">
    </div>
    <div class="workspace">
        <div class="preview-pane">
            <div class="preview-box">
                <svg id="avatar-svg" xmlns="http://w3.org" viewBox="0 0 400 400">
                    <path id="svg-bg" d="M0 0h400v400H0z" fill="var(--bg)"/>
                    <path id="svg-shadow" d="M275.8 269.6c-52.8-40.2-46.9-75.2-47.6-89.5h32.2c3.8-6.6 5.7-14 5.7-21.5l-36.5-24c22.6-16.3 27.8-47.9 11.5-70.5-5.6-7.7-13.2-13.8-22.1-17.3-5.9-2.4-47.2 133.4-47.2 133.4-.1 3.1-.2 7.2-.2 12.1 0 13.5 33.1 11.4 31.4 23.4-2.6 17.8-3.2 31.3-18.5 74.1-10.4 28.9-79.4 0-84.3 14.2-3.6 10.6-5.3 21.7-5.2 32.8 0 1.3 2.7 20.4 105.1 20.4s105.1-19.1 105.1-20.4c-.1-29.2-10.9-53.1-29.4-67.2z" fill="var(--shadow)"/>
                    <path id="svg-base" d="M198.1 287.6c5.7-25.9 10.7-53.5 13.8-70 3.8-20.6-27.5-24.3-40.3-26.2-.6 17.6-5.5 46.2-47.4 78.2-11.3 8.6-19.7 20.9-24.6 35.8 11.3 5.5 26.4 8.8 49.7 8.8 14.9 0 42.6 1.8 48.8-26.6zM220.1 180.1c5-12.9 4.3-21.5 4.3-21.5l-20.7-24c22-9.4 35.2-27 35.2-47.5 0-15.8-7.4-30.6-19.9-40.2-25.8-10.5-55.3 1.9-65.9 27.7-8.8 21.6-1.7 46.4 17.2 60l-36.5 24c0 7.6 1.9 15 5.7 21.5h80.6z" fill="var(--base)"/>
                    <path id="svg-highlight" d="M197.1 53.3c29.1 4.5-13.4 38.4-26.9 36.8-12.7-1.6-.4-41 26.9-36.8z" fill="var(--highlight)"/>
                </svg>
            </div>
            <div class="export-wrapper">
                <button class="btn-main">Export Avatar</button>
                <div class="dropdown-menu">
                    <button class="btn-opt" id="opt-svg">Download SVG (Vector)</button>
                    <button class="btn-opt" id="opt-png">Download PNG (Raster)</button>
                </div>
            </div>
        </div>
        <div>
            <table>
                <thead><tr><th>Component</th><th>Hex</th><th>RGB</th></tr></thead>
                <tbody>
                    <tr id="r-bg"><td><span class="swatch"></span>Avatar Background</td><td class="hex-output"></td><td class="rgb-output"></td></tr>
                    <tr id="r-highlight"><td><span class="swatch"></span>Avatar Highlight</td><td class="hex-output"></td><td class="rgb-output"></td></tr>
                    <tr id="r-base"><td><span class="swatch"></span>Avatar Base</td><td class="hex-output"></td><td class="rgb-output"></td></tr>
                    <tr id="r-shadow"><td><span class="swatch"></span>Avatar Shadow</td><td class="hex-output"></td><td class="rgb-output"></td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
    const p = document.getElementById('picker'), root = document.documentElement, svgEl = document.getElementById('avatar-svg');
    const SF = 0.728723, HF = 0.447761, BF = 0.641791;
    let colors = {};

    function hToR(h) { const n = parseInt(h.substring(1), 16); return { r: (n >> 16) & 255, g: (n >> 8) & 255, b: n & 255 }; }
    function rToH(r, g, b) { return "#" + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1); }

    function getCleanSvg() {
        const clone = svgEl.cloneNode(true);
        clone.querySelector('#svg-bg').setAttribute('fill', colors.bg);
        clone.querySelector('#svg-shadow').setAttribute('fill', colors.shadow);
        clone.querySelector('#svg-base').setAttribute('fill', colors.base);
        clone.querySelector('#svg-highlight').setAttribute('fill', colors.highlight);
        return new XMLSerializer().serializeToString(clone);
    }

    function update(hex, save = true) {
        const base = hToR(hex);
        const s = { r: Math.round(base.r * SF), g: Math.round(base.g * SF), b: Math.round(base.b * SF) };
        const h = { r: Math.round(base.r + (255 - base.r) * HF), g: Math.round(base.g + (255 - base.g) * HF), b: Math.round(base.b + (255 - base.b) * HF) };
        const b = { r: Math.round(base.r + (255 - base.r) * BF), g: Math.round(base.g + (255 - base.g) * BF), b: Math.round(base.b + (255 - base.b) * BF) };
        colors = { base: hex, shadow: rToH(s.r, s.g, s.b), highlight: rToH(h.r, h.g, h.b), bg: rToH(b.r, b.g, b.b) };

        root.style.setProperty('--base', colors.base); root.style.setProperty('--shadow', colors.shadow);
        root.style.setProperty('--highlight', colors.highlight); root.style.setProperty('--bg', colors.bg);

        setRow('bg', colors.bg, b); setRow('highlight', colors.highlight, h); setRow('base', colors.base, base); setRow('shadow', colors.shadow, s);
        
        // Save state snapshot to system disk
        if (save) localStorage.setItem('lastChessBaseColor', hex);
    }

    function setRow(id, hex, rgb) {
        const el = document.getElementById(`r-${id}`);
        el.querySelector('.swatch').style.backgroundColor = hex;
        el.querySelector('.hex-output').textContent = hex.toUpperCase();
        el.querySelector('.rgb-output').textContent = `${rgb.r}, ${rgb.g}, ${rgb.b}`;
    }

    const getFilename = (ext) => `chess-avatar-${colors.base.replace('#', '')}.${ext}`;

    document.getElementById('opt-svg').addEventListener('click', () => {
        const url = URL.createObjectURL(new Blob([getCleanSvg()], { type: 'image/svg+xml;charset=utf-8' }));
        const a = document.createElement('a'); a.href = url; a.download = getFilename('svg'); a.click(); URL.revokeObjectURL(url);
    });

    document.getElementById('opt-png').addEventListener('click', () => {
        const url = URL.createObjectURL(new Blob([getCleanSvg()], { type: 'image/svg+xml;charset=utf-8' }));
        const img = new Image(); img.src = url;
        img.onload = () => {
            const canvas = document.createElement('canvas'); canvas.width = 400; canvas.height = 400;
            canvas.getContext('2d').drawImage(img, 0, 0, 400, 400);
            const a = document.createElement('a'); a.href = canvas.toDataURL('image/png'); a.download = getFilename('png'); a.click(); URL.revokeObjectURL(url);
        };
    });

    p.addEventListener('input', (e) => update(e.target.value));

    // Boot Loader Hook: Fetch previous color on startup or execute gray default rules
    const savedColor = localStorage.getItem('lastChessBaseColor') || '#bcbbb7';
    p.value = savedColor;
    update(savedColor, false);
</script>
</body>
</html>
